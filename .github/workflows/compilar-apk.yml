name: Compilar APK y publicar web

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: APK para Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Ordenar el proyecto (encuentra los archivos aunque estén en otra carpeta)
        run: |
          echo "Archivos del repositorio:"
          find . -not -path "./.git*" -not -path "*/node_modules*" -not -path "*/vendor/*" -not -path "*/icons/*" -not -path "*/assets/*" | sort | head -150
          if [ ! -f package.json ]; then
            FOUND=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1 || true)
            if [ -n "$FOUND" ]; then cp -rn "$(dirname "$FOUND")"/. .; fi
          fi
          if [ ! -f package.json ]; then echo "::error::Falta package.json. Sube todos los archivos del zip."; exit 1; fi
          BEST=""
          while IFS= read -r f; do
            d=$(dirname "$f")
            if [ ! -f "$d/index.html" ]; then continue; fi
            if [ -z "$BEST" ]; then BEST="$d"; fi
            if grep -q quickMatch "$d/online.js" 2>/dev/null; then
              if ! grep -q quickMatch "$BEST/online.js" 2>/dev/null || [ "$d" = "./www" ]; then BEST="$d"; fi
            fi
          done < <(find . -name app.js -not -path "*/node_modules/*" | sort)
          if [ -z "$BEST" ]; then echo "::error::No encuentro los archivos del juego (index.html y app.js). Sube la carpeta www del zip."; exit 1; fi
          if [ "$BEST" != "./www" ]; then
            echo "Uso los archivos del juego que hay en: $BEST"
            rm -rf /tmp/web && mkdir -p /tmp/web
            for x in index.html styles.css app.js questions.js online.js firebase-config.js web-url.js manifest.webmanifest sw.js vendor icons; do
              if [ -e "$BEST/$x" ]; then cp -r "$BEST/$x" /tmp/web/; fi
            done
            rm -rf www && mkdir www && cp -r /tmp/web/. www/
          fi
          if [ ! -f www/firebase-config.js ] || grep -q PEGA_AQUI www/firebase-config.js; then
            GOOD=""
            while IFS= read -r f; do
              if ! grep -q PEGA_AQUI "$f"; then GOOD="$f"; fi
            done < <(find . -name firebase-config.js -not -path "*/node_modules/*" -not -path "./www/*")
            if [ -n "$GOOD" ]; then echo "Uso la configuración de Firebase de $GOOD"; cp "$GOOD" www/firebase-config.js; fi
          fi
          if [ ! -f www/firebase-config.js ]; then echo "window.FIREBASE_CONFIG = null;" > www/firebase-config.js; fi
          if [ ! -f www/web-url.js ]; then echo "window.QUESITOS_WEB = '';" > www/web-url.js; fi
          for x in styles.css questions.js online.js vendor sw.js manifest.webmanifest icons; do
            if [ ! -e "www/$x" ]; then echo "::warning::Falta www/$x (súbelo desde la carpeta www del zip)"; fi
          done
          echo "Carpeta www lista:"; ls www

      - name: Dirección de la web para las invitaciones
        run: echo "window.QUESITOS_WEB = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/';" > www/web-url.js

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Icono y pantalla de carga
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android

      - name: Ajustes de Android (vertical, vibración y versión)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity$#<activity android:screenOrientation="portrait"#' $MANIFEST
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $MANIFEST
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Usar siempre la misma firma (para poder actualizar sin desinstalar)
        run: |
          if [ -f android-keystore/debug.keystore ]; then
            mkdir -p ~/.android
            cp android-keystore/debug.keystore ~/.android/debug.keystore
          fi

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Quesitos.apk

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Quesitos-apk
          path: Quesitos.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Quesitos 1.0.${{ github.run_number }}
          body: |
            Android: descarga **Quesitos.apk** desde el móvil y ábrelo para instalarlo.
            iPhone: abre https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ en Safari y pulsa Compartir > «Añadir a pantalla de inicio».
          files: Quesitos.apk

  web:
    name: Web para iPhone (y cualquier móvil)
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Ordenar el proyecto (encuentra los archivos aunque estén en otra carpeta)
        run: |
          echo "Archivos del repositorio:"
          find . -not -path "./.git*" -not -path "*/node_modules*" -not -path "*/vendor/*" -not -path "*/icons/*" -not -path "*/assets/*" | sort | head -150
          if [ ! -f package.json ]; then
            FOUND=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1 || true)
            if [ -n "$FOUND" ]; then cp -rn "$(dirname "$FOUND")"/. .; fi
          fi
          if [ ! -f package.json ]; then echo "::error::Falta package.json. Sube todos los archivos del zip."; exit 1; fi
          BEST=""
          while IFS= read -r f; do
            d=$(dirname "$f")
            if [ ! -f "$d/index.html" ]; then continue; fi
            if [ -z "$BEST" ]; then BEST="$d"; fi
            if grep -q quickMatch "$d/online.js" 2>/dev/null; then
              if ! grep -q quickMatch "$BEST/online.js" 2>/dev/null || [ "$d" = "./www" ]; then BEST="$d"; fi
            fi
          done < <(find . -name app.js -not -path "*/node_modules/*" | sort)
          if [ -z "$BEST" ]; then echo "::error::No encuentro los archivos del juego (index.html y app.js). Sube la carpeta www del zip."; exit 1; fi
          if [ "$BEST" != "./www" ]; then
            echo "Uso los archivos del juego que hay en: $BEST"
            rm -rf /tmp/web && mkdir -p /tmp/web
            for x in index.html styles.css app.js questions.js online.js firebase-config.js web-url.js manifest.webmanifest sw.js vendor icons; do
              if [ -e "$BEST/$x" ]; then cp -r "$BEST/$x" /tmp/web/; fi
            done
            rm -rf www && mkdir www && cp -r /tmp/web/. www/
          fi
          if [ ! -f www/firebase-config.js ] || grep -q PEGA_AQUI www/firebase-config.js; then
            GOOD=""
            while IFS= read -r f; do
              if ! grep -q PEGA_AQUI "$f"; then GOOD="$f"; fi
            done < <(find . -name firebase-config.js -not -path "*/node_modules/*" -not -path "./www/*")
            if [ -n "$GOOD" ]; then echo "Uso la configuración de Firebase de $GOOD"; cp "$GOOD" www/firebase-config.js; fi
          fi
          if [ ! -f www/firebase-config.js ]; then echo "window.FIREBASE_CONFIG = null;" > www/firebase-config.js; fi
          if [ ! -f www/web-url.js ]; then echo "window.QUESITOS_WEB = '';" > www/web-url.js; fi
          for x in styles.css questions.js online.js vendor sw.js manifest.webmanifest icons; do
            if [ ! -e "www/$x" ]; then echo "::warning::Falta www/$x (súbelo desde la carpeta www del zip)"; fi
          done
          echo "Carpeta www lista:"; ls www

      - name: Preparar la web
        run: |
          echo "window.QUESITOS_WEB = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/';" > www/web-url.js
          if [ -f www/sw.js ]; then sed -i "s/quesitos-v1/quesitos-${{ github.run_number }}/" www/sw.js; fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publicar la web
        id: deploy
        uses: actions/deploy-pages@v4
